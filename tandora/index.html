<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tandora — has moved</title>
  <meta http-equiv="refresh" content="0; url=https://spencergraffunder.github.io/tandoraweb/">
  <link rel="canonical" href="https://spencergraffunder.github.io/tandoraweb/">
  <meta name="robots" content="noindex, follow">
  <style>
    body { background: #111; color: #e6e6e6; font-family: "DejaVu Sans Mono", Consolas, monospace;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    main { max-width: 40em; padding: 2em; text-align: center; }
    h1 { font-size: 1.4em; }
    a { color: #4aa3ff; }
  </style>
  <script>
    // The previous Godot build registered a service worker under this path.
    // Unregister it and drop its caches so returning players aren't served the
    // retired build from cache, then redirect to the standalone Tandora site.
    var TARGET = "https://spencergraffunder.github.io/tandoraweb/";
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
    }
    if ("caches" in window) {
      caches.keys().then(function (names) {
        names.forEach(function (n) { caches.delete(n); });
      });
    }
    location.replace(TARGET);
  </script>
</head>
<body>
  <main>
    <h1>Tandora has moved</h1>
    <p>Tandora now lives at its own site:
      <a href="https://spencergraffunder.github.io/tandoraweb/">https://spencergraffunder.github.io/tandoraweb/</a>
    </p>
    <p>If you are not redirected automatically, <a href="https://spencergraffunder.github.io/tandoraweb/">click here</a>.</p>
  </main>
</body>
</html>
